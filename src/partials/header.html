<header class="site-header">
    <div class="header-content">
        <div class="brand">
            <img class="brand-logo" src="/src/assets/logo.png" alt="Erasmus Events logo" />
        </div>

        <form class="header-search" role="search">
            <span class="search-icon" aria-hidden="true">
                <img src="/src/assets/search.png" alt="" />
            </span>
            <input type="search" placeholder="Search" aria-label="Search events" />
        </form>

        <div class="header-events">
            <span class="events-icon" aria-hidden="true">
                <img src="/src/assets/calendar.svg" alt="" />
            </span>
            <span> X upcoming events</span>
        </div>
    </div>
</header>
