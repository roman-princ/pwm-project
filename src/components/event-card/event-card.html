<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Card</title>
    <link rel="stylesheet" href="event-card.css">
</head>

<body>
    <a href="../../pages/event-detail/event-detail.html" class="event-card-link">
        <div class="event-card">
            <div class="event-image"></div>

            <div class="event-content">
                <div class="header-row">
                    <h2 class="event-title">Event name</h2>
                    <span class="category-tag">social</span>
                </div>

                <p class="description">
                    Meet fellow Erasmus students! Join us for an evening of music, dancing, and international
                    networking.
                </p>
            </div>

            <div class="event-content" style="flex: 0 0 auto; border-left: none;">
                <div class="event-details">
                    <div class="detail-item">
                        <span class="icon">📅</span> Sunday, February 8, 2026
                    </div>
                    <div class="detail-item">
                        <span class="icon">🕒</span> 20:00
                    </div>
                    <div class="detail-item">
                        <span class="icon">📍</span> Bravia bar
                    </div>
                    <div class="detail-item">
                        <span class="icon">👥</span> 45/100 attending <span class="spots-left">(55 spots left)</span>
                    </div>
                </div>
            </div>
        </div>
    </a>
</body>

</html>
