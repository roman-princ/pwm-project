<a href="{{detailUrl}}" class="event-card__link">
    <div class="event-card">
        <div class="event-card__image"></div>
        <span class="category-tag category-tag--{{category}}">
            {{category}}
        </span>

        <div class="event-card__content">
            <h2 class="event-card__title">{{title}}</h2>
            <p class="event-card__description">{{description}}</p>
        </div>

        <div class="event-card__content event-card__content--details">
            <div class="event-card__details">
                <div class="event-card__detail-item">
                    <span class="event-card__icon">📅</span> {{dateFormatted}}
                </div>
                <div class="event-card__detail-item">
                    <span class="event-card__icon">🕒</span> {{time}}
                </div>
                <div class="event-card__detail-item">
                    <span class="event-card__icon">📍</span> {{location}}
                </div>
            </div>
        </div>
    </div>
</a>
