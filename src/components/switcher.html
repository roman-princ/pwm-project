<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switcher</title>
    <link rel="stylesheet" href="../styles/switcher.css">
</head>

<body>
    <div class="view-switcher" role="tablist" aria-label="View switcher">
        <button class="view-switcher__option is-active" role="tab" aria-selected="true" type="button">
            <img class="view-switcher__icon" src="/src/assets/list.svg" alt="" aria-hidden="true" />
            <span>List View</span>
        </button>
        <button class="view-switcher__option" role="tab" aria-selected="false" type="button">
            <img class="view-switcher__icon" src="/src/assets/calendar.svg" alt="" aria-hidden="true" />
            <span>Calendar View</span>
        </button>
    </div>
</body>

</html>
