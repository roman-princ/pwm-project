<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Erasmus Las Palmas</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../components/button/button.css">
    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <div data-include="partials/header/header"></div>

    <main>
        <section class="register">
            <div class="register__header">
                <div id="backBtn"></div>
                <h1 id="registerHeading"></h1>
            </div>

            <form class="register__form">
                <div class="form-group">
                    <label for="firstName" id="firstNameLabel"></label>
                    <input type="text" id="firstName" name="firstName" required minlength="2" maxlength="50"
                        pattern="[A-Za-zÀ-ÿ\s'-]+" title="First name must be 2-50 letters">
                    <span class="form-error" id="firstNameError"></span>
                </div>

                <div class="form-group">
                    <label for="surname" id="surnameLabel"></label>
                    <input type="text" id="surname" name="surname" required minlength="2" maxlength="50"
                        pattern="[A-Za-zÀ-ÿ\s'-]+" title="Surname must be 2-50 letters">
                    <span class="form-error" id="surnameError"></span>
                </div>

                <div class="form-group">
                    <label for="email" id="emailLabel"></label>
                    <input type="email" id="email" name="email" required title="Please enter a valid e-mail address">
                    <span class="form-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="organization" id="organizationLabel"></label>
                    <input type="text" id="organization" name="organization" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="username" id="usernameLabel"></label>
                    <input type="text" id="username" name="username" required minlength="3" maxlength="30"
                        pattern="[A-Za-z0-9_]+"
                        title="Username must be 3-30 characters (letters, numbers, underscores)">
                    <span class="form-error" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="password" id="passwordLabel"></label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="64"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
                        title="Password must be at least 8 characters with uppercase, lowercase and a number">
                    <span class="form-error" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm" id="passwordConfirmLabel"></label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" required minlength="8">
                    <span class="form-error" id="passwordConfirmError"></span>
                </div>

                <button type="submit" class="btn btn--primary" id="registerSubmitBtn"></button>
            </form>
        </section>
    </main>

    <div data-include="partials/footer/footer"></div>

    <script src="../../scripts/data-service.js"></script>
    <script src="../../scripts/components.js"></script>
    <script src="registration.js"></script>
    <script src="../../scripts/referencer.js"></script>
</body>

</html>
