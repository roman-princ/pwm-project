<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Erasmus Las Palmas</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../components/button/button.css">
    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <div data-include="partials/header/header"></div>

    <main>
        <section class="register">
            <div class="register__header">
                <div data-include="components/back-button/back-button" data-size="24" data-stroke="2"></div>
                <h1>Registration</h1>
            </div>

            <form class="register__form">
                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="surname">Surname:</label>
                    <input type="text" id="surname" name="surname" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="organization">Organization:</label>
                    <input type="text" id="organization" name="organization">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">Password again:</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" required>
                </div>

                <button type="submit" class="btn btn--primary">Register</button>
            </form>
        </section>
    </main>

    <div data-include="partials/footer/footer"></div>

    <script src="../../scripts/referencer.js"></script>
</body>

</html>
