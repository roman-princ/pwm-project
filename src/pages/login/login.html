<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Erasmus Events</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../components/button/button.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div data-include="partials/header/header"></div>
    <section class="login">
        <div class="login__header">
            <div data-include="components/back-button/back-button" data-size="24" data-stroke="2"></div>
            <h1>Log in</h1>
        </div>

        <form class="login__form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="login__registration-link">
                <a href="../registration/registration.html">Registration?</a>
            </div>

            <button type="submit" class="btn btn--primary">Log in</button>
        </form>
    </section>
    <div data-include="partials/footer/footer"></div>

    <script src="../../scripts/referencer.js"></script>
    <script src="login.js"></script>
</body>

</html>
