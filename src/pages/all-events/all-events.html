<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Erasmus Events</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="all-events.css">
    <link rel="stylesheet" href="../../components/event-card/event-card.css">
    <link rel="stylesheet" href="../../components/button/button.css">
</head>

<body>
    <div data-include="partials/header/header"></div>
    <section class="all-events">
        <h1>All Events</h1>

        <div class="all-events__filters">
            <p class="all-events__filter-label">Filter by category</p>
            <div class="all-events__category-tags" id="categoryFilters">
                <button class="filter-tag filter-tag--active">All Events</button>
                <button class="filter-tag">Cultural</button>
                <button class="filter-tag">Academic</button>
                <button class="filter-tag">Social</button>
                <button class="filter-tag">Sports</button>
                <button class="filter-tag">Trips</button>
                <button class="filter-tag">Language</button>
            </div>
        </div>

        <div id="eventsContainer">
        </div>

        <div class="all-events__cta">
            <div data-include="components/button/button" data-href="#" data-variant="outline" data-text="See more">
            </div>
        </div>

    </section>
    <div data-include="partials/footer/footer"></div>
    <script src="../../scripts/event-card.js"></script>
    <script>
        const container = document.getElementById("eventsContainer");
        if (container) renderEventCards(eventsData, container);
    </script>
    <script src="../../scripts/referencer.js"></script>
    <script src="../../scripts/events-interaction.js"></script>

</body>

</html>
