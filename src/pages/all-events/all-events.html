<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Events - Erasmus Events</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="all-events.css">
    <link rel="stylesheet" href="../../components/event-card/event-card.css">
    <link rel="stylesheet" href="../../components/button/button.css">
</head>

<body>
    <div data-include="partials/header/header"></div>
    <section class="all-events">
        <h1 id="pageTitle"></h1>

        <div class="all-events__filters">
            <p class="all-events__filter-label" id="filterLabel"></p>
            <div class="all-events__category-tags" id="categoryFilters"></div>
        </div>

        <div id="eventsContainer">
        </div>

        <div class="all-events__cta" id="seeMoreBtnContainer"></div>

    </section>
    <div data-include="partials/footer/footer"></div>
    <script src="../../scripts/data-service.js"></script>
    <script src="../../scripts/event-card.js"></script>
    <script src="../../scripts/components.js"></script>
    <script>
        (async function initAllEventsPage() {
            let allEventsContent = {
                pageTitle: "All Events",
                filterLabel: "Filter by category",
            };

            if (typeof DataService !== "undefined") {
                try {
                    const data = await DataService.getPageContent("allEvents");
                    allEventsContent = { ...allEventsContent, ...data };
                } catch (e) {
                    console.warn("AllEvents: could not load content from db.json, using defaults.", e);
                }
            }

            setPageContent(allEventsContent);
            createFilterTags("categoryFilters", allEventsContent.pageTitle);

            let events = [];
            if (typeof DataService !== "undefined") {
                try {
                    events = await DataService.getEvents();
                } catch (e) {
                    console.warn("AllEvents: could not load events from db.json.", e);
                }
            }

            const container = document.getElementById("eventsContainer");
            if (container && events.length) renderEventCards(events, container);

            const seeMoreBtn = document.getElementById("seeMoreBtnContainer");
            if (seeMoreBtn) seeMoreBtn.appendChild(createButton("#", "outline", "See more"));

            // Process the newly-added data-include elements (event cards, buttons).
            if (typeof window.loadIncludes === "function") {
                await window.loadIncludes();
            }
        })();
    </script>
    <script src="../../scripts/referencer.js"></script>
    <script src="../../scripts/events-interaction.js"></script>

</body>

</html>
