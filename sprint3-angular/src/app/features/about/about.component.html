<main class="about">
    <section class="about__hero">
        <h1 class="about__title">{{ title }}</h1>
        <p class="about__subtitle">{{ subtitle }}</p>
    </section>

    <section class="about__content">
        <h2 class="about__heading">{{ heading }}</h2>
        <p class="about__description">{{ description }}</p>
    </section>

    <section class="about__image">
        <img src="/assets/placeholder.png" alt="About us illustration" />
    </section>
</main>
