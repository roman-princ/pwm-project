<section class="register">
    <div class="register__header">
        <app-back-button></app-back-button>
        <h1>Registration</h1>
    </div>

    <form class="register__form" [class.was-validated]="submitted" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input id="firstName" type="text" formControlName="firstName" required minlength="2" maxlength="50" />
            <span class="error-message">First name must be 2-50 letters.</span>
        </div>

        <div class="form-group">
            <label for="surname">Surname:</label>
            <input id="surname" type="text" formControlName="surname" required minlength="2" maxlength="50" />
            <span class="error-message">Surname must be 2-50 letters.</span>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input id="email" type="email" formControlName="email" required />
            <span class="error-message">Please enter a valid e-mail address.</span>
        </div>

        <div class="form-group">
            <label for="organization">Organization:</label>
            <input id="organization" type="text" formControlName="organization" />
        </div>

        <div class="form-group">
            <label for="username">Username:</label>
            <input id="username" type="text" formControlName="username" readonly required minlength="3"
                maxlength="30" />
            <span class="error-message">Username is generated automatically from e-mail.</span>
            <p *ngIf="usernameSuggestion">{{ usernameSuggestion }}</p>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input id="password" type="password" formControlName="password" required minlength="8" />
            <span class="error-message">Password must be at least 8 chars.</span>
        </div>

        <div class="form-group">
            <label for="passwordAgain">Password again:</label>
            <input id="passwordAgain" type="password" formControlName="passwordAgain" required minlength="8" />
            <span class="error-message">Passwords do not match.</span>
        </div>

        <button type="submit" class="btn btn--primary">Register</button>
    </form>

    <p class="error-message" style="display:block" *ngIf="error">{{ error }}</p>
</section>
