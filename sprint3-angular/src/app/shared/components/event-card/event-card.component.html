<div [routerLink]="['/event-detail', event.id]" class="event-card__link">
    <div class="event-card">
        <div class="event-card__image"></div>
        <div class="event-card__content event-card__content--left">
            <h2 class="event-card__title">{{ event.title }}</h2>
            <p class="event-card__description">{{ event.description }}</p>
        </div>

        <div class="event-card__content event-card__content--right event-card__content--details">
            <span class="category-tag" [ngClass]="'category-tag--' + event.category">
                {{ event.category }}
            </span>
            <div class="event-card__details">
                <div class="event-card__detail-item">
                    <span class="event-card__icon">📅</span> {{ event.dateFormatted || event.date }}
                </div>
                <div class="event-card__detail-item">
                    <span class="event-card__icon">🕒</span> {{ event.time }}
                </div>
                <div class="event-card__detail-item">
                    <span class="event-card__icon">📍</span> {{ event.location }}
                </div>
                <div class="event-card__detail-item">
                    <span class="event-card__icon">👥</span> {{ event.organizer }}
                </div>
            </div>
            <button *ngIf="editable" type="button" [routerLink]="['/edit-event', event.id]"
                class="event-card__edit-btn btn btn--primary" (click)="$event.stopPropagation()">
                Edit
            </button>
        </div>
    </div>
</div>
